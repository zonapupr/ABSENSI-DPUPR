<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f4fb6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Absensi DPUPR KSB</title>
  <link rel="preload" as="image" href="/assets/brand-logos.webp">

  <style>
    html,body{margin:0;min-height:100%;background:#eef4fb}
    #splash{
      position:fixed;inset:0;z-index:1000000;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      gap:16px;padding:24px;box-sizing:border-box;
      background:linear-gradient(145deg,#0b3f9b,#1f78d1);
      color:#fff;font-family:Arial,sans-serif;
      transition:opacity .28s ease,visibility .28s ease;
    }

    #splash .splash-brand{
      width:min(82vw,330px);background:#fff;border-radius:20px;padding:8px 12px;
      box-shadow:0 12px 30px rgba(0,0,0,.15);box-sizing:border-box;
    }
    #splash .splash-brand img{display:block;width:100%;height:auto}
    #splash .splash-title{font-size:24px;font-weight:800;text-align:center}
    #splash .splash-text{font-size:14px;opacity:.86;text-align:center}
    #splash .splash-spinner{
      width:38px;height:38px;border-radius:50%;
      border:4px solid rgba(255,255,255,.28);
      border-top-color:#fff;
      animation:splashSpin .8s linear infinite;
      box-sizing:border-box;
    }
    @keyframes splashSpin{to{transform:rotate(360deg)}}
  </style>
  <link rel="manifest" href="/manifest.json?v=282">
  <link rel="stylesheet" href="/assets/style.css?v=282">
</head>
<body>
  <div id="splash" class="splash" aria-live="polite">
    <div class="splash-brand"><img src="/assets/brand-logos.webp" width="1050" height="135" alt="Identitas Pemerintah Kabupaten Sumbawa Barat, PUPR, BerAKHLAK, dan Bangga Melayani Bangsa"></div>
    <div class="splash-title">Absensi DPUPR KSB</div>
    <div class="splash-spinner"></div>
    <div id="splashText" class="splash-text">Memuat aplikasi...</div>
  </div>

  <div id="toastRoot" class="toast-root"></div>

  <div id="globalLoader" class="global-loader hidden">
    <div class="loader-card">
      <div class="spinner"></div>
      <span id="globalLoaderText">Memproses...</span>
    </div>
  </div>

  <section id="loginView" class="login-screen hidden">
    <div class="login-card">
      <div class="login-brand-logos"><img src="/assets/brand-logos.webp" width="1050" height="135" alt="Identitas Pemerintah Kabupaten Sumbawa Barat, PUPR, BerAKHLAK, dan Bangga Melayani Bangsa"></div>
      <h1>Absensi DPUPR KSB</h1>

      <label class="field">
        <span>Username / ID / NIP</span>
        <input id="loginUser" autocomplete="username" placeholder="Masukkan Username / ID / NIP">
      </label>

      <label class="field">
        <span>PIN</span>
        <div class="password-wrap">
          <input id="loginPin" type="password" inputmode="numeric" autocomplete="current-password" placeholder="Masukkan PIN">
          <button id="togglePinBtn" type="button" class="icon-plain" aria-label="Tampilkan PIN">👁</button>
        </div>
      </label>

      <button id="loginBtn" class="btn primary xl" type="button">
        <span class="btn-label">Masuk</span>
      </button>

      <div id="loginHint" class="login-hint">Aplikasi siap.</div>
    </div>
  </section>

  <section id="appView" class="app-shell hidden">
    <header class="app-header">
      <div class="header-copy">
        <div class="header-kicker">ABSENSI DPUPR KSB</div>
        <div class="header-title-row">
          <div id="headerTitle" class="header-title">Beranda</div>
          <img id="headerBrandLogos"
               class="header-brand-logos"
               src="/assets/brand-logos.webp"
               width="1050" height="135"
               alt="Identitas DPUPR KSB">
        </div>
      </div>
      <button id="headerAction" class="avatar-btn" type="button">A</button>
    </header>

    <main id="pageRoot" class="page-root"></main>

    <nav id="bottomNav" class="bottom-nav bottom-nav-3">
      <button data-route="home" class="nav-item active" type="button">
        <span class="nav-icon">⌂</span><span>Beranda</span>
      </button>
      <button data-route="history" class="nav-item" type="button">
        <span class="nav-icon">▤</span><span>Rekap</span>
      </button>
      <button data-route="account" class="nav-item" type="button">
        <span class="nav-icon">◉</span><span>Akun</span>
      </button>
    </nav>
  </section>

  <div id="modalRoot" class="modal-root hidden"></div>

  <script src="/assets/app.js?v=282"></script>
</body>
</html>
