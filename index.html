<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0D47A1">
  <title>Absensi DPUPR KSB</title>

  <link rel="stylesheet" href="/assets/style.css?v=140">
  <link rel="stylesheet" href="/assets/ux.css?v=140">
</head>
<body>
  <div id="toast"></div>

  <div id="netBar" class="net-bar hidden">
    <span class="mini-spinner"></span>
    <span id="netBarText">Memproses...</span>
  </div>

  <section id="loginView" class="screen center">
    <div class="brand-card">
      <div class="brand-mark">DPUPR</div>
      <h1>Absensi DPUPR KSB</h1>
      <p>GPS + Selfie</p>

      <input id="username" placeholder="Username / ID / NIP" autocomplete="username">
      <input id="pin" placeholder="PIN" type="password" inputmode="numeric" autocomplete="current-password">

      <button id="loginBtn" class="btn primary" onclick="login()">
        <span id="loginBtnText">Masuk</span>
      </button>

      <div id="loginStatus" class="login-status hidden">
        <span class="mini-spinner"></span>
        <span id="loginStatusText">Menghubungkan ke server...</span>
      </div>

      <div id="jsStatus" class="app-ready-note">Memuat aplikasi...</div>
    </div>
  </section>

  <section id="appView" class="screen hidden">
    <header class="topbar">
      <div>
        <div class="small">ABSENSI DPUPR KSB</div>
        <strong id="helloName">Pegawai</strong>
      </div>
      <button class="icon-btn" onclick="logout()">Keluar</button>
    </header>

    <main id="mainContent" class="main"></main>

    <nav class="bottom-nav">
      <button onclick="showHome()" id="navHome" class="active">Beranda</button>
      <button onclick="showHistory()" id="navHistory">Rekap</button>
      <button onclick="showLeave()" id="navLeave">Izin</button>
      <button onclick="showAdmin()" id="navAdmin" class="hidden">Admin</button>
      <button onclick="showAccount()" id="navAccount">Akun</button>
    </nav>
  </section>

  <div id="attendanceModal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-head">
        <strong id="attTitle">Absensi</strong>
        <button class="icon-btn" onclick="closeAttendance()">✕</button>
      </div>

      <div class="gps-box">
        <div><b>Status GPS</b></div>
        <div id="gpsStatus">Mencari lokasi...</div>
        <div id="gpsInfo" class="muted"></div>
      </div>

      <video id="camera" autoplay playsinline muted></video>
      <canvas id="snapshot" class="hidden"></canvas>
      <img id="preview" class="hidden selfie-preview" alt="Selfie">

      <div class="actions">
        <button class="btn secondary" onclick="captureSelfie()">Ambil Selfie</button>
        <button id="submitAttendBtn" class="btn primary" disabled onclick="submitAttendance()">Simpan Absen</button>
      </div>
    </div>
  </div>

  <script src="/assets/app.js?v=140"></script>
  <script src="/assets/ux.js?v=140"></script>
</body>
</html>
